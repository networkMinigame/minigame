name: CD

# main에 반영되면 게임 서버(EC2)에 배포한다. Actions 탭의 Run workflow 버튼으로 수동 배포도 할 수 있다.
# PR에서는 돌리지 않는다. 머지 전 코드가 실제 서버에 올라가면 안 되기 때문이다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 연달아 머지돼도 배포가 겹치지 않게 한 번에 하나씩 순서대로 돌린다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # 테스트가 실패하면 배포하지 않는다. installDist는 실행에 필요한 jar를 build/install/networkGame/lib에 모은다.
      - name: 테스트하고 배포본 만들기
        run: ./gradlew test installDist

      # 러너는 매번 새 서버라 SSH 준비부터 한다. 권한이 넓으면 SSH가 키 사용을 거부한다.
      - name: SSH 폴더 만들기
        run: install -m 700 -d ~/.ssh

      - name: 배포 키 저장
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # 처음 접속 때 묻는 "이 서버를 믿을까요?"의 답을 미리 넣는다. 키가 다르면 접속을 거부한다.
      - name: 서버 신원 등록
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # 뒤 단계에서 ssh game-server 한 마디로 접속하도록 주소·계정·키를 묶어 둔다.
      - name: 접속 설정 작성
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          cat > ~/.ssh/config <<EOF
          Host game-server
            HostName $DEPLOY_HOST
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      # 새 jar를 lib.new에 올린 뒤 통째로 바꿔 끼운다. 기존 lib에 덮어쓰면 빠진 라이브러리의 옛 jar가 남아 classpath에 섞인다.
      - name: 서버에 올리기
        run: |
          ssh game-server 'rm -rf ~/networkGame/lib.new'
          scp -r build/install/networkGame/lib game-server:~/networkGame/lib.new

      - name: 교체하고 재시작
        run: |
          ssh game-server '
            set -e
            cd ~/networkGame
            rm -rf lib.old
            mv lib lib.old
            mv lib.new lib
            sudo systemctl restart networkgame
          '

      # restart는 프로세스를 띄우자마자 끝나서, 서버가 실제로 접속을 받는지는 12345 포트가 열렸는지로 확인한다.
      - name: 서버가 떴는지 확인
        run: |
          ssh game-server '
            for i in $(seq 1 15); do
              if ss -ltn | grep -q ":12345 "; then
                echo "서버 정상: 12345 포트 대기 중 (${i}초)"
                exit 0
              fi
              sleep 1
            done
            echo "15초 안에 12345 포트가 열리지 않음"
            journalctl -u networkgame -n 30 --no-pager
            exit 1
          '
