<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" width="1500" height="960" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="1500" height="960" rx="12" fill="#ffffff"/>
<defs><marker id="arrow-tcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker><marker id="arrow-recv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="arrow-send" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bf8700"/></marker><marker id="arrow-make" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker><marker id="arrow-close" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker></defs>
<text x="40" y="46" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1f2328">클라이언트 스레드 구조</text>
<text x="1460" y="46" font-size="14" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#57606a">v2  |  #34 GUI 클라이언트 서버 연결</text>
<rect x="30" y="80" width="1150" height="770" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
<text x="54" y="104" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#57606a">CLIENT</text>
<rect x="60" y="125" width="420" height="165" rx="12" fill="#e6f6f3" stroke="#1a7f6e" stroke-width="1.6"/>
<text x="80" y="151" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1f2328">main 스레드 × 1</text>
<text x="462" y="151" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#57606a">연결까지만 하고 끝남</text>
<text x="84" y="182" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1f2328">① LobbyAssetLoader.load()  그림 읽기</text>
<text x="84" y="206" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1f2328">② new Client(host, port)  연결 · TCP_NODELAY</text>
<text x="84" y="230" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1f2328">③ invokeLater(LobbySession.show())  후 종료</text>
<text x="84" y="254" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1f2328">실패하면 대화상자를 띄우고 끝 (스레드 시작 전)</text>
<rect x="60" y="330" width="590" height="470" rx="12" fill="#eef4ff" stroke="#0969da" stroke-width="1.6"/>
<text x="80" y="356" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1f2328">EDT × 1  (Swing 화면 스레드)</text>
<text x="632" y="356" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#57606a">로비 상태는 EDT만 바꾼다</text>
<rect x="90" y="380" width="530" height="120" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="355" y="404" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">LobbySession</text>
<text x="110" y="436" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1f2328">show(): 창 · 타이머 · 방향키 → client.start(콜백) → send(JOIN)</text>
<text x="110" y="456" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1f2328">handle(ServerMsg): WELCOME · JOINED를 LobbyState에 반영</text>
<text x="110" y="476" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#1f2328">windowClosed: timer.stop() → client.close()</text>
<rect x="90" y="540" width="220" height="76" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="200.0" y="568.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">Timer</text>
<text x="200.0" y="588.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">16ms마다 이동 · 다시 그리기</text>
<rect x="90" y="640" width="220" height="76" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="200.0" y="668.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">ArrowKeys</text>
<text x="200.0" y="688.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">눌린 방향키 모음</text>
<rect x="350" y="540" width="270" height="76" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/>
<text x="485.0" y="568.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">LobbyState</text>
<text x="485.0" y="588.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">접속자 목록 · 내 playerId</text>
<rect x="350" y="640" width="270" height="76" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="485.0" y="668.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">LobbyPanel</text>
<text x="485.0" y="688.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">LobbyState를 읽어 그림</text>
<path d="M 312 578 L 348 578" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow-make)"/>
<path d="M 200 638 L 200 618" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow-make)"/>
<path d="M 485 618 L 485 638" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow-make)"/>
<path d="M 485 502 L 485 538" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow-make)"/>
<text x="345" y="756" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">Timer · 키 입력 · 서버 메시지 처리가 모두 EDT 한 줄로 돌아서 락이 없다</text>
<rect x="700" y="125" width="450" height="675" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
<text x="720" y="151" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1f2328">Client × 1  (연결 1개)</text>
<text x="1132" y="151" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#57606a">Reader + Writer = 2개 스레드</text>
<rect x="740" y="190" width="230" height="70" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1.6"/>
<text x="855.0" y="215.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">sendQueue</text>
<text x="855.0" y="235.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">ClientMsg · 크기 제한 없음</text>
<rect x="740" y="310" width="230" height="90" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="855.0" y="335.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">WriteHandler</text>
<text x="855.0" y="355.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">Writer 스레드</text>
<text x="855.0" y="375.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">take() → encode → write</text>
<rect x="740" y="520" width="230" height="100" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="855.0" y="550.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">ReadHandler</text>
<text x="855.0" y="570.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">Reader 스레드</text>
<text x="855.0" y="590.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">readLine() → decodeServer()</text>
<rect x="740" y="680" width="230" height="96" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6"/>
<text x="855.0" y="708.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">close()</text>
<text x="855.0" y="728.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">여러 번 불려도 한 번만</text>
<text x="855.0" y="748.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">소켓 닫기 + Writer interrupt</text>
<rect x="1030" y="290" width="80" height="360" rx="8" fill="#d8dee4" stroke="#57606a" stroke-width="1.6"/>
<text x="1070.0" y="470.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">socket</text>
<rect x="1230" y="330" width="230" height="200" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
<text x="1345" y="380" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#57606a">SERVER</text>
<text x="1345" y="418" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">서버 :12345</text>
<text x="1345" y="448" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">구조는 v1 참고</text>
<path d="M 482 205 L 698 205" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow-make)"/>
<rect x="564.25" y="195" width="51.5" height="18" rx="4" fill="#ffffff"/>
<text x="590" y="205" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#8c959f">② 연결</text>
<path d="M 270 292 L 270 328" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow-make)"/>
<rect x="279.5" y="300" width="101" height="18" rx="4" fill="#ffffff"/>
<text x="330" y="310" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#8c959f">③ invokeLater</text>
<path d="M 622 410 L 690 410 L 690 225 L 738 225" fill="none" stroke="#bf8700" stroke-width="1.8" marker-end="url(#arrow-send)"/>
<rect x="651.5" y="290" width="77" height="18" rx="4" fill="#ffffff"/>
<text x="690" y="300" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#bf8700">send(JOIN)</text>
<path d="M 855 262 L 855 308" fill="none" stroke="#bf8700" stroke-width="1.8" marker-end="url(#arrow-send)"/>
<path d="M 972 355 L 1028 355" fill="none" stroke="#bf8700" stroke-width="1.8" marker-end="url(#arrow-send)"/>
<path d="M 1112 380 L 1228 380" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow-tcp)"/>
<rect x="1152" y="370" width="36" height="18" rx="4" fill="#ffffff"/>
<text x="1170" y="380" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#57606a">TCP</text>
<path d="M 1228 480 L 1114 480" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow-tcp)"/>
<rect x="1152" y="470" width="36" height="18" rx="4" fill="#ffffff"/>
<text x="1170" y="480" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#57606a">TCP</text>
<path d="M 1028 570 L 974 570" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-recv)"/>
<path d="M 738 570 L 672 570 L 672 470 L 624 470" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-recv)"/>
<rect x="630.25" y="510" width="83.5" height="18" rx="4" fill="#ffffff"/>
<text x="672" y="520" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0969da">invokeLater</text>
<path d="M 652 730 L 738 730" fill="none" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-close)"/>
<rect x="669.25" y="720" width="51.5" height="18" rx="4" fill="#ffffff"/>
<text x="695" y="730" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#cf222e">창 닫기</text>
<path d="M 972 730 L 1070 730 L 1070 652" fill="none" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-close)"/>
<rect x="1200" y="570" width="280" height="230" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.6"/>
<text x="1220" y="598" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1f2328">책임 구분</text>
<text x="1220" y="634" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1f2328">Client</text>
<text x="1220" y="654" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#57606a">소켓과 스레드만 안다. Swing은 모름</text>
<text x="1220" y="676" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1f2328">LobbySession</text>
<text x="1220" y="696" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#57606a">메시지를 EDT로 넘겨 반영, 창 닫으면 연결 닫기</text>
<text x="1220" y="718" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1f2328">LobbyState</text>
<text x="1220" y="738" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#57606a">EDT 전용이라 락 없음</text>
<text x="1220" y="760" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1f2328">main</text>
<text x="1220" y="780" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#57606a">연결해서 넘기고 닫지 않음</text>
<text x="60" y="826" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#57606a">Reader가 화면을 직접 고치지 않는다. 받은 메시지는 invokeLater로 EDT에 넘기고, 보낼 메시지는 EDT가 sendQueue에 넣기만 한다.</text>
<path d="M 60 905 L 120 905" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-recv)"/>
<text x="134" y="905" font-size="15" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="#1f2328">수신</text>
<path d="M 320 905 L 380 905" fill="none" stroke="#bf8700" stroke-width="1.8" marker-end="url(#arrow-send)"/>
<text x="394" y="905" font-size="15" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="#1f2328">전송</text>
<path d="M 580 905 L 640 905" fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow-make)"/>
<text x="654" y="905" font-size="15" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="#1f2328">생성 · 시작 · 호출</text>
<path d="M 840 905 L 900 905" fill="none" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-close)"/>
<text x="914" y="905" font-size="15" font-weight="500" text-anchor="start" dominant-baseline="middle" fill="#1f2328">종료 경로</text>
<text x="1460" y="905" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#57606a">서버 내부는 v1 전체도</text>
</svg>
