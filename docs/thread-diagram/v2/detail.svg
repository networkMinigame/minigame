<path d="M 1082 175 L 1118 175" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-recv)"/>
<line x1="190" y1="276" x2="1450" y2="276" stroke="#d0d7de" stroke-width="1.6"/>
<text x="1450" y="266" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#57606a">여기서 스레드가 바뀐다</text>
<path d="M 1220 217 L 1220 298" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-recv)"/>
