<rect x="1140" y="300" width="180" height="100" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="1230.0" y="330.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">handle(message)</text>
<text x="1230.0" y="350.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">sealed switch</text>
<text x="1230.0" y="370.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">9개 case</text>
<rect x="860" y="290" width="250" height="34" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="985.0" y="307.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">WELCOME → state.welcome(id, 목록)</text>
<rect x="860" y="333" width="250" height="34" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="985.0" y="350.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">JOINED → state.save(Player.from(p))</text>
<rect x="860" y="376" width="250" height="34" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.6"/>
<text x="985.0" y="393.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">그 외 7개 → 지금은 무시 (#35~#38)</text>
<path d="M 1138 307 L 1112 307" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-recv)"/>
<path d="M 1138 350 L 1112 350" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-recv)"/>
<path d="M 1138 393 L 1112 393" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-recv)"/>
<rect x="620" y="310" width="200" height="80" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/>
