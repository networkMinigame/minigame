<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1070" width="1500" height="1070" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="1500" height="1070" rx="12" fill="#ffffff"/>
<defs><marker id="arrow-tcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker><marker id="arrow-recv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="arrow-send" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bf8700"/></marker><marker id="arrow-make" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker><marker id="arrow-close" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker></defs>
<text x="40" y="46" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1f2328">클라이언트 메시지 흐름 상세</text>
<text x="1460" y="46" font-size="14" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#57606a">v2  |  받기 · 보내기 · 끝내기</text>
<rect x="30" y="80" width="1440" height="360" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
<text x="50" y="106" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#1f2328">① 받기: 서버가 보낸 한 줄이 화면에 그려지기까지</text>
<text x="1452" y="106" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#57606a">Reader는 화면을 고치지 않는다</text>
<rect x="50" y="145" width="130" height="60" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="115.0" y="175.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">Reader 스레드</text>
<rect x="50" y="315" width="130" height="60" rx="8" fill="#eef4ff" stroke="#0969da" stroke-width="1.6"/>
<text x="115.0" y="345.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">EDT</text>
<rect x="200" y="135" width="180" height="80" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="290.0" y="165.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">readLine()</text>
<text x="290.0" y="185.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">한 줄 읽기</text>
<rect x="420" y="135" width="180" height="80" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="510.0" y="165.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">빈 줄?</text>
<text x="510.0" y="185.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">그러면 건너뜀</text>
<rect x="640" y="135" width="200" height="80" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="740.0" y="165.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">decodeServer(line)</text>
<text x="740.0" y="185.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">JSON → ServerMsg</text>
<rect x="880" y="135" width="200" height="80" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="980.0" y="165.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">onMessage.accept()</text>
<text x="980.0" y="185.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">LobbySession이 준 콜백</text>
<rect x="1120" y="135" width="200" height="80" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1.6"/>
<text x="1220.0" y="165.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">invokeLater</text>
<text x="1220.0" y="185.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">EDT 이벤트 큐에 넣기</text>
<rect x="620" y="226" width="240" height="30" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6"/>
<text x="740.0" y="241.0" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#1f2328">JacksonException → 로그만 남기고 다음 줄</text>
