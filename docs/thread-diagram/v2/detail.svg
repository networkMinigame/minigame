<text x="720.0" y="360.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#57606a">접속자 · 내 playerId</text>
<path d="M 858 307 L 840 307 L 840 335 L 822 335" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-recv)"/>
<path d="M 858 350 L 822 350" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-recv)"/>
<rect x="380" y="310" width="200" height="80" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
